<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: #0E0E10;
      color: #FFFFFF;
      font-family: -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));
      text-align: center;
      gap: 10px;
    }
    h1 { font-size: 22px; font-weight: 700; }
    p { color: #8B8B90; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Mini App готов к работе</h1>
  <p id="hello">Здесь начинается ваше приложение</p>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor("#0E0E10"); tg.setBackgroundColor("#0E0E10"); } catch (e) {}
      const u = tg.initDataUnsafe?.user;
      if (u) {
        document.getElementById("hello").textContent = "Привет, " + (u.first_name || "друг") + "!";
      }
    }
  </script>
</body>
</html>
